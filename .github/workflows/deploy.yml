name: Deploy CV Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURECLIENTID }}
          tenant-id: ${{ secrets.AZURETENANTID }}
          subscription-id: ${{ secrets.AZURESUBSCRIPTIONID }}

      -  name: Login to ACR
         run: az acr login --name emrysacr

      - name: Build and push Docker image
        run: |
          docker build -t emrysacr.azurecr.io/cv-website:${{ github.sha }} .
          docker push emrysacr.azurecr.io/cv-website:${{ github.sha }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-infra-rebuild \
            --name aks-infra-rebuild \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/cv-website \
            cv-website=emrysacr.azurecr.io/cv-website:${{ github.sha }}

          kubectl rollout status deployment/cv-website