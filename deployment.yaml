apiVersion: apps/v1
kind: Deployment

metadata:
  name: cv-website

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cv-website

  template:
    metadata:
      labels:
        app: cv-website

    spec:
      containers:
        - name: cv-website
          image: emrysacr.azurecr.io/cv-website:v1
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: cv-website-service

spec:
  type: LoadBalancer

  selector:
    app: cv-website

  ports:
    - port: 80
      targetPort: 80